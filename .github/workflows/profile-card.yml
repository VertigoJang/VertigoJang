name: Update Profile Card

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 1회 (UTC 18:00 = KST 03:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/gen_card.py
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/profile-card.svg
          git commit -m "chore: update profile card [skip ci]" || true
          git push
